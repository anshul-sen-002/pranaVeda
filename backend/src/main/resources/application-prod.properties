# =====================================================================
# Production profile - Supabase / managed PostgreSQL + hardened defaults.
#
# RULE: every credential/secret is ENV-ONLY with NO default. An unset
# secret makes the app fail fast at startup (agents.md 9) instead of
# running with a guessed value.
#
# Non-secret behaviour differences vs dev:
#   - Hibernate validates the schema instead of updating it
#     (migrations run before deploy).
#   - Refresh cookie is always Secure (https only).
#   - SQL statements are NOT echoed to the console.
# =====================================================================

# --- Managed PostgreSQL (Supabase pooler URL via host secrets) -----------
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10

# Schema is owned by migrations - never auto-update in production.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Production CORS: exact deployed origins only ------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# --- Authentication ------------------------------------------------------
app.security.jwt.secret=${JWT_ACCESS_SECRET:}
app.security.jwt.access-ttl=${JWT_ACCESS_TTL:15m}
app.security.jwt.refresh-ttl=${JWT_REFRESH_TTL:14d}
app.security.refresh-cookie-name=pv_refresh
# Always Secure in production (refresh cookie requires https).
app.security.cookie-secure=true

# --- First ADMIN bootstrap -----------------------------------------------
# Create the first admin by setting ADMIN_EMAIL + ADMIN_PASSWORD as host
# secrets for the very first deploy, then REMOVE them so later restarts
# cannot recreate or alter the account.
ADMIN_EMAIL=${ADMIN_EMAIL:}
ADMIN_PASSWORD=${ADMIN_PASSWORD:}

# --- Media storage (Cloudinary) ------------------------------------------
# Mandatory in production: uploads fail fast without them.
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.folder=pranaveda

# Upload limits stay server-side (agents.md 2.15).
app.media.max-image-bytes=5242880
app.media.max-video-bytes=104857600
app.media.max-audio-bytes=52428800

# --- AI wellness companion (OpenRouter) ----------------------------------
# Key stays server-side; unset = chat endpoints return 503 AI_UNAVAILABLE.
app.ai.provider=openrouter
app.ai.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
app.ai.api-key=${OPENROUTER_API_KEY:}
app.ai.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
app.ai.max-tokens=1024
app.ai.timeout-seconds=30
app.ai.max-message-chars=4000

# --- Transactional email / SMTP -----------------------------------------
# EMAIL IS ENABLED BY DEFAULT IN PROD so sign-in alerts actually send.
# The deployment MUST provide MAIL_HOST + MAIL_PASSWORD (+ MAIL_FROM/
# MAIL_USERNAME) via host secrets; a missing password fails fast via
# the unresolved ${MAIL_PASSWORD:} placeholder below.
spring.autoconfigure.exclude=org.springframework.boot.mail.autoconfigure.MailSenderAutoConfiguration
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:PranaVeda}
app.mail.host=${MAIL_HOST:}
app.mail.port=${MAIL_PORT:587}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
