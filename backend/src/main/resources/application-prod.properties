# =====================================================================
# Production profile - environment variables are MANDATORY.
#
# Every ${VAR} below has NO default on purpose: startup fails fast with an
# "unresolved placeholder" error when the deployment environment is
# incomplete, instead of silently connecting somewhere unintended.
# =====================================================================

# --- Database (provided by the deployment platform / secrets manager) ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- No SQL echo in production ------------------------------------------
spring.jpa.show-sql=false

# --- CORS: exact public origins, comma-separated, HTTPS only ------------
# e.g. CORS_ALLOWED_ORIGINS=https://pranaveda.example,https://www.pranaveda.example
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# --- Trust the reverse proxy for scheme/host (HTTPS terminated upstream) -
server.forward-headers-strategy=framework

# --- Auth (Phase 2): secrets are MANDATORY, no dev fallbacks -------------
app.security.jwt.secret=${JWT_ACCESS_SECRET}
app.security.cookie-secure=true
