# Production configuration is injected through the deployment platform.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.security.jwt.secret=${JWT_ACCESS_SECRET}
app.security.jwt.access-ttl=${JWT_ACCESS_TTL:15m}
app.security.jwt.refresh-ttl=${JWT_REFRESH_TTL:15d}
app.security.refresh-cookie-name=pv_refresh
app.security.cookie-secure=true

# Production sends registration emails by default; set MAIL_ENABLED=false only
# when intentionally disabling mail. Credentials and verified sender remain required.
app.mail.enabled=${MAIL_ENABLED:true}

# Cloudinary is required for media persistence; container-local disks are ephemeral.
app.storage.provider=cloudinary
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}
app.cloudinary.folder=${CLOUDINARY_FOLDER:pranaveda}

app.media.max-image-bytes=${MAX_IMAGE_BYTES:5242880}
app.media.max-video-bytes=${MAX_VIDEO_BYTES:104857600}
app.media.max-audio-bytes=${MAX_AUDIO_BYTES:52428800}
app.media.max-image-dimension=${MAX_IMAGE_DIMENSION:4096}
app.media.max-image-pixels=${MAX_IMAGE_PIXELS:12000000}
app.media.max-audio-seconds=${MAX_AUDIO_SECONDS:3600}

app.ai.provider=openrouter
app.ai.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
app.ai.api-key=${OPENROUTER_API_KEY:}
app.ai.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
app.ai.max-tokens=${AI_MAX_TOKENS:1024}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}
app.ai.max-message-chars=${AI_MAX_MESSAGE_CHARS:4000}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
