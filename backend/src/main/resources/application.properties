# =====================================================================
# PranaVeda backend - shared configuration (applies to every profile)
# Profile-specific settings: application-dev.properties / application-prod.properties
# Documentation: docs/architecture.md, section "Configuration and environment"
# =====================================================================

spring.application.name=pranaveda

# Profile selection. Default is "dev"; production sets SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Optional convenience: load the repository-root .env file (KEY=VALUE format)
# so local runs and tooling share one place for values. Everything is
# optional; real OS environment variables always take precedence over
# file-based properties.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# --- Persistence (shared) ------------------------------------------------
# Schema is owned by Flyway migrations only; Hibernate never generates DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- HTTP error handling (never leak stack traces or internals) ---------
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

server.port=${SERVER_PORT:8080}

# --- OpenAPI / Swagger UI (springdoc 3.x, Boot 4 line) -------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorting=alpha
springdoc.swagger-ui.operations-sorting=alpha

# --- Actuator: health only, no configuration details exposed -------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# --- Security / authentication (Phase 2) ---------------------------------
# HS256 requires >= 32 bytes. The dev default below is NOT a secret - the
# prod profile overrides it without a default so production fails fast.
app.security.jwt.secret=${JWT_ACCESS_SECRET:dev-only-access-secret-change-me-0123456789abcdef0123456789abcdef}
app.security.jwt.access-ttl=${JWT_ACCESS_TTL:15m}
app.security.jwt.refresh-ttl=${JWT_REFRESH_TTL:14d}
app.security.refresh-cookie-name=pv_refresh
# Secure attribute of the refresh cookie; the prod profile forces true.
app.security.cookie-secure=${REFRESH_COOKIE_SECURE:false}
