# =====================================================================
# PranaVeda backend - shared configuration (applies to every profile)
# Profile-specific settings: application-dev.properties / application-prod.properties
# Documentation: docs/architecture.md, section "Configuration and environment"
# =====================================================================

spring.application.name=pranaveda

# Profile selection. Default is "dev"; production sets SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Optional convenience: load the repository-root .env file (KEY=VALUE format)
# so local runs and tooling share one place for values. Everything is
# optional; real OS environment variables always take precedence over
# file-based properties.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# --- Persistence (shared) ------------------------------------------------
# Schema is generated/updated by Hibernate from the JPA entity mappings.
# NOTE: `update` only ever ADDS tables/columns/constraints - it never drops or
# alters existing ones. For local dev this is fine; see docs/architecture.md.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- HTTP error handling (never leak stack traces or internals) ---------
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

server.port=${SERVER_PORT:8080}

# --- OpenAPI / Swagger UI (springdoc 3.x, Boot 4 line) -------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorting=alpha
springdoc.swagger-ui.operations-sorting=alpha

# --- Actuator: health only, no configuration details exposed -------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# --- Security / authentication (Phase 2) ---------------------------------
# HS256 requires >= 32 bytes. The dev default below is NOT a secret - the
# prod profile overrides it without a default so production fails fast.
app.security.jwt.secret=${JWT_ACCESS_SECRET:dev-only-access-secret-change-me-0123456789abcdef0123456789abcdef}
app.security.jwt.access-ttl=${JWT_ACCESS_TTL:15m}
app.security.jwt.refresh-ttl=${JWT_REFRESH_TTL:14d}
app.security.refresh-cookie-name=pv_refresh
# Secure attribute of the refresh cookie; the prod profile forces true.
app.security.cookie-secure=${REFRESH_COOKIE_SECURE:false}

# --- Media storage (Cloudinary) -------------------------------------------
# Credentials stay server-side; the app boots without them (the Cloudinary
# client is built lazily on first upload). CLOUDINARY_URL is preferred when set.
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.folder=pranaveda

# Server-side upload limits and accepted MIME types (agents.md 2.15).
app.media.max-image-bytes=5242880
app.media.max-video-bytes=104857600
app.media.max-audio-bytes=52428800

# --- AI wellness companion (OpenRouter) -----------------------------------
# The API key never reaches the client. Without a key the /api/v1/ai/** chat
# endpoints return 503 AI_UNAVAILABLE; the rest of the app is unaffected.
app.ai.provider=openrouter
app.ai.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
app.ai.api-key=${OPENROUTER_API_KEY:}
app.ai.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
app.ai.max-tokens=1024
app.ai.timeout-seconds=30
app.ai.max-message-chars=4000
