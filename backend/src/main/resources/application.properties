# =====================================================================
# PranaVeda backend - shared configuration (applies to every profile)
# Profile-specific settings: application-dev.properties / application-prod.properties
# Documentation: docs/architecture.md, section "Configuration and environment"
# =====================================================================

spring.application.name=pranaveda

# Profile selection. Only two files exist: this shared one and the dev
# profile below. Local runs default to "dev" (all secrets from .env);
# production sets the SAME values via host environment variables.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Optional convenience: load backend/.env (KEY=VALUE format) so local
# runs keep one place for values. Everything is optional; real OS
# environment variables always take precedence over file-based properties.
spring.config.import=optional:file:.env[.properties]

# --- Persistence (shared) ------------------------------------------------
# Schema is generated/updated by Hibernate from the JPA entity mappings.
# NOTE: `update` only ever ADDS tables/columns/constraints - it never drops or
# alters existing ones. For local dev this is fine; see docs/architecture.md.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- HTTP error handling (never leak stack traces or internals) ---------
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

server.port=${SERVER_PORT:8080}

# --- Upload transport caps (defence-in-depth: MediaService re-checks per kind)
# Must stay just above the largest app.media.* limit (100 MB video).
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=105MB
spring.servlet.multipart.max-request-size=105MB

# --- OpenAPI / Swagger UI (springdoc 3.x, Boot 4 line) -------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorting=alpha
springdoc.swagger-ui.operations-sorting=alpha

# --- Actuator: health only, no configuration details exposed -------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# --- Security / authentication (Phase 2) ---------------------------------
# HS256 requires >= 32 bytes. The dev default below is NOT a secret - the
# prod profile overrides it without a default so production fails fast.
app.security.jwt.secret=${JWT_ACCESS_SECRET:}
app.security.jwt.access-ttl=${JWT_ACCESS_TTL:15m}
app.security.jwt.refresh-ttl=${JWT_REFRESH_TTL:14d}
app.security.refresh-cookie-name=pv_refresh
# Secure attribute of the refresh cookie; the prod profile forces true.
app.security.cookie-secure=${REFRESH_COOKIE_SECURE:false}

# --- Transactional email / SMTP (sign-in alerts) -------------------------
# Off by default so local dev boots with no SMTP server. When disabled,
# EmailService is a silent no-op and no JavaMailSender bean is created.
# Boot's own MailSenderAutoConfiguration is excluded so it can never register
# a second sender; MailSenderConfig builds ours only when enabled=true.
#
# SECURITY: every credential comes from the environment - there are NO
# secret defaults anywhere in this file. Anything marked "no default" fails
# fast at startup if the variable is missing, so an incomplete deployment
# never starts silently.
spring.autoconfigure.exclude=org.springframework.boot.mail.autoconfigure.MailSenderAutoConfiguration
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:}
app.mail.host=${MAIL_HOST:}
app.mail.port=${MAIL_PORT:587}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}


