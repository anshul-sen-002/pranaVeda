# =====================================================================
# Development profile (default) - LOCAL PostgreSQL, developer-friendly logs
#
# Connects to the local PostgreSQL 17 installation
# (Windows service: postgresql-x64-17, localhost:5432).
# Set DB_USERNAME / DB_PASSWORD in .env to match your instance.
#
# Every executed SQL statement is echoed to the console
# (spring.jpa.show-sql) so you can follow the queries against your
# local database while developing.
# =====================================================================

# --- Local PostgreSQL connection (edit .env to match your instance) ------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pranaveda}
spring.datasource.username=${DB_USERNAME:pranaveda}
spring.datasource.password=${DB_PASSWORD:pranaveda_dev}
# Small pool: one local developer, not a server workload.
spring.datasource.hikari.maximum-pool-size=5

# --- Developer-friendly SQL logging -------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- CORS: Next.js dev server ------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
