# =====================================================================
# Development profile (default) - LOCAL PostgreSQL, developer-friendly logs
#
# Connects to the local PostgreSQL 17 installation
# (Windows service: postgresql-x64-17, localhost:5432).
# Set DB_USERNAME / DB_PASSWORD in .env to match your instance.
#
# Every executed SQL statement is echoed to the console
# (spring.jpa.show-sql) so you can follow the queries against your
# local database while developing.
# =====================================================================

# --- Local PostgreSQL connection (edit backend/.env: DB_* are env-only) --
# SECURITY: credentials come from the environment only - there are NO real
# defaults here. The app reads backend/.env locally, or OS env vars in prod.
# Missing values fail fast at startup rather than guessing silently.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
# Small pool: one local developer, not a server workload.
spring.datasource.hikari.maximum-pool-size=5

# --- Developer-friendly SQL logging -------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- CORS: Next.js dev server ------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}


app.security.jwt.secret=${JWT_ACCESS_SECRET:}
app.security.jwt.access-ttl=${JWT_ACCESS_TTL:15m}
app.security.jwt.refresh-ttl=${JWT_REFRESH_TTL:14d}
app.security.refresh-cookie-name=pv_refresh
# Secure attribute of the refresh cookie; the prod profile forces true.
app.security.cookie-secure=${REFRESH_COOKIE_SECURE:false}

# --- Media storage (Cloudinary) -------------------------------------------
# Credentials stay server-side and come from the environment only (env-only,
# no defaults); the app boots without them (the Cloudinary
# client is built lazily on first upload). CLOUDINARY_URL is preferred when set.
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.folder=pranaveda

# Server-side upload limits and accepted MIME types (agents.md 2.15).
app.media.max-image-bytes=5242880
app.media.max-video-bytes=104857600
app.media.max-audio-bytes=52428800

# --- AI wellness companion (OpenRouter) -----------------------------------
# The API key never reaches the client and is env-only (no default).
# Without a key the /api/v1/ai/** chat
# endpoints return 503 AI_UNAVAILABLE; the rest of the app is unaffected.
app.ai.provider=openrouter
app.ai.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
app.ai.api-key=${OPENROUTER_API_KEY:}
app.ai.model=${OPENROUTER_MODEL:openrouter/free}
app.ai.max-tokens=1024
app.ai.timeout-seconds=30
app.ai.max-message-chars=4000

spring.autoconfigure.exclude=org.springframework.boot.mail.autoconfigure.MailSenderAutoConfiguration
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:}
app.mail.host=${MAIL_HOST:}
app.mail.port=${MAIL_PORT:587}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}